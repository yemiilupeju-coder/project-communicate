/* VOICE: reverent, warm, playful wonder — a gallery at dusk
   IDEA: an artist's canvas in a gilded frame; a glowing hand guides each stroke
   PICTURE: the canvas itself, painted live, 12 animated scenes
   COLOUR and TYPE: deep plum gallery wall, gilt gold, warm parchment; Fraunces (embedded) + system sans
   LAYOUT: slim header with progress dots, framed canvas filling the screen, glass card for the verse */
:root{color-scheme:dark;--bg:#151024;--ink:#f6efe2;--muted:#bfb3d6;--gold:#e7b85a;--rose:#e07b93}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
body{margin:0;background:radial-gradient(ellipse at 50% 25%,#30254d 0%,#151024 65%);color:var(--ink);font:16px/1.55 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;min-height:100vh;min-height:100dvh;overflow-x:clip}
#app{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
header{display:flex;align-items:center;gap:12px 20px;padding:12px max(3vw,16px);flex-wrap:wrap}
h1{font:600 clamp(20px,2.4vw,26px)/1.1 Fraunces,Georgia,serif;margin:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
h1 em{font-weight:500;color:var(--muted);font-size:17px;margin-left:6px}
#dots{display:flex;gap:7px;flex:1 0 auto;justify-content:center}
.dot{flex:none}
.dot{width:13px;height:13px;border-radius:50%;border:1.5px solid rgba(231,184,90,.45);transition:all .3s}
.dot.ok{background:var(--gold);border-color:var(--gold);box-shadow:0 0 10px rgba(231,184,90,.6)}
.dot.miss{background:var(--rose);border-color:var(--rose)}
.dot.now{border-color:var(--gold);box-shadow:0 0 0 4px rgba(231,184,90,.22);transform:scale(1.15)}
.right{display:flex;align-items:center;gap:12px;font-size:14px;color:var(--muted)}
button{font:700 15px/1 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;min-height:44px;padding:0 20px;border-radius:999px;border:1.5px solid var(--gold);background:transparent;color:var(--ink);cursor:pointer;transition:transform .15s,background .2s}
button:hover{transform:translateY(-1px);background:rgba(231,184,90,.12)}
button:focus-visible,#cv:focus-visible{outline:3px solid #fff3c4;outline-offset:3px}
button.primary{background:var(--gold);color:#22160a}
button.primary:hover{background:#f2c977}
button.ghost{border-color:transparent;color:var(--muted)}
#mute{min-height:38px;padding:0 14px;font-size:14px}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:6px max(3vw,24px) 26px}
#frame{position:relative;width:min(100%,calc((100vh - var(--hh,60px) - 70px)*1.5),1560px);width:min(100%,calc((100dvh - var(--hh,60px) - 70px)*1.5),1560px);aspect-ratio:3/2;border-radius:4px;
  box-shadow:0 0 0 9px #2b1f14,0 0 0 12px #d4a94f,0 0 0 15px #6b4e22,0 0 0 17px #e8c46e,0 30px 90px rgba(0,0,0,.65)}
#cv{display:block;width:100%;height:100%;border-radius:3px;touch-action:none;background:#f5eee0}
@media (pointer:fine){#cv.play{cursor:none}}
.ov{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:4%;color:#3b2a1a;overflow:auto}
.ov .in{max-width:620px}
.ov h2{font:600 clamp(24px,4.2vw,50px)/1.05 Fraunces,Georgia,serif;margin:0 0 .4em;text-wrap:balance;color:#3b2516}
.ov p{margin:0 auto 1.1em;font-size:clamp(14px,1.6vw,18px);max-width:50ch;color:#5a4330}
.ov .small{font:italic 500 clamp(13px,1.25vw,15px)/1.5 Fraunces,Georgia,serif;color:#7a5f42;margin-top:1.3em}
.ov button{border-color:#b8862c;color:#3b2516}
.ov button.primary{color:#22160a}
.card{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);width:min(580px,92%);background:rgba(20,14,34,.8);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(231,184,90,.5);border-radius:16px;padding:18px 22px 16px;text-align:center;animation:rise .6s ease-out}
@keyframes rise{from{opacity:0;transform:translate(-50%,14px)}}
.card .k{margin:0;color:var(--gold);font-weight:700;font-size:14px}
.card h2{font:600 clamp(22px,2.6vw,32px)/1.1 Fraunces,Georgia,serif;margin:4px 0 8px;text-wrap:balance}
.card .v{font:italic 500 17px/1.5 Fraunces,Georgia,serif;margin:0 auto 4px;max-width:46ch}
.card .ref{margin:0 0 14px;color:var(--muted);font-size:14px}
.btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
#showCard{position:absolute;right:14px;bottom:14px;background:rgba(20,14,34,.7);backdrop-filter:blur(8px)}
@media (max-width:1050px){#gal{display:none}}
@media (max-width:760px){
  h1 em{display:none}
  #frame{box-shadow:0 0 0 5px #2b1f14,0 0 0 7px #d4a94f,0 0 0 9px #6b4e22,0 20px 50px rgba(0,0,0,.6)}
  main{padding:4px 14px 18px}
  .card{position:fixed;bottom:12px;width:calc(100% - 24px);padding:14px 16px}
  .card .v{font-size:15px}
  .ov .small{display:none}
}
@media (prefers-reduced-motion:reduce){.card{animation:none}.dot{transition:none}}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Here a Little, There a Little</h1>
    <div id="dots" aria-label="Progress"></div>
    <div class="right"><span id="gal"></span><button id="mute" aria-pressed="false">Sound on</button><button id="fs" hidden>Full screen</button></div>
  </header>
  <main>
    <div id="frame">
      <canvas id="cv" tabindex="0" aria-label="Here a Little, There a Little painting game. Tap where the glowing hand points, or press Space to paint there."></canvas>
      <div id="intro" class="ov"><div class="in">
        <h2>Here a Little, There a Little</h2>
        <p>God already sees the finished picture. Watch for His hand and paint where it points. Every yes reveals a little more.</p>
        <button id="begin" class="primary">Begin painting</button>
        <p class="small">“Line upon line, line upon line; here a little, and there a little.” Isaiah 28:10 (KJV)</p>
      </div></div>
      <div id="card" class="card" hidden>
        <p class="k" id="cKick"></p>
        <h2 id="cTitle"></h2>
        <p class="v" id="cVerse"></p>
        <p class="ref" id="cRef"></p>
        <div class="btns"><button id="bA" class="primary"></button><button id="bB"></button><button id="bHide" class="ghost"></button></div>
      </div>
      <button id="showCard" hidden>Show verse</button>
      <p id="live" class="sr" aria-live="polite"></p>
    </div>
  </main>
</div>
<script>
{
const W=1200,H=800,TAU=Math.PI*2;
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d'),card=$('card');
const mk=()=>{const c=document.createElement('canvas');return[c,c.getContext('2d')]};
const [sc,sx]=mk(),[mc,mx]=mk(),[pc,px]=mk();
let R=1,UI=1;
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- drawing helpers ---------- */
const srand=s=>()=>(s=(s*16807)%2147483647,(s-1)/2147483646);
const circ=(c,x,y,r)=>{c.beginPath();c.arc(x,y,Math.max(0,r),0,TAU)};
const ell=(c,x,y,a,b,r=0)=>{c.beginPath();c.ellipse(x,y,Math.max(0,a),Math.max(0,b),r,0,TAU)};
function lin(c,x0,y0,x1,y1,st){const g=c.createLinearGradient(x0,y0,x1,y1);st.forEach((s,i)=>g.addColorStop(i/(st.length-1),s));return g}
function glow(c,x,y,r,rgb,a){const g=c.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,`rgba(${rgb},${a})`);g.addColorStop(1,`rgba(${rgb},0)`);c.fillStyle=g;c.fillRect(x-r,y-r,2*r,2*r)}
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}

$('mute').onclick=e=>{muted=!muted;e.currentTarget.textContent=muted?'Sound off':'Sound on';e.currentTarget.setAttribute('aria-pressed',muted)};
const toL=e=>{const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H}};
cv.addEventListener('pointerdown',e=>{if(AC&&AC.state==='suspended')AC.resume();const p=toL(e);if(e.pointerType==='mouse')ptr=p;if(phase==='play')paint(p.x,p.y);else if(phase==='done'&&card.hidden){card.hidden=false;$('showCard').hidden=true}});
cv.addEventListener('pointermove',e=>{if(e.pointerType==='mouse')ptr=toL(e)});
cv.addEventListener('pointerleave',()=>ptr=null);
cv.addEventListener('keydown',e=>{if((e.key===' '||e.key==='Enter')&&phase==='play'){e.preventDefault();const c=cells[order[step]];paint(c.tx,c.ty)}});

/* ---------- overlays drawn on the canvas ---------- */
function drawSplash(c,s,now){const e=ease((now-s.t0)/.7);c.save();c.translate(s.x,s.y);c.rotate(s.rot);c.scale(e,e);
 for(let L=0;L<3;L++){c.fillStyle=`hsla(${s.hue+L*28},70%,${62+L*6}%,.3)`;for(let i=0;i<s.n;i++){c.save();c.rotate(i/s.n*TAU+L*.3);ell(c,0,-(46-L*14),20-L*4,44-L*12);c.fill();c.restore()}}
 c.fillStyle=`hsla(${s.hue+60},80%,70%,.85)`;for(let i=0;i<7;i++){circ(c,Math.cos(i*2.4)*10,Math.sin(i*2.4)*10,4);c.fill()}
 c.fillStyle=`hsla(${s.hue},70%,60%,.35)`;for(const d of s.dr){circ(c,d[0],d[1],d[2]);c.fill()}c.restore()}
function drawHand(c,x,y,rot,a){c.save();c.translate(x,y);c.rotate(rot);c.scale(UI,UI);c.globalAlpha=a;
 const sk=lin(c,0,-180,0,0,['#fff3dc','#ffe2b8']);
 c.shadowColor='rgba(255,205,110,.95)';c.shadowBlur=28*R*UI;c.fillStyle='#fffaf0';rr(c,-22,-182,70,50,12);c.fill();c.shadowBlur=0;c.fillStyle='#e7b85a';c.fillRect(-22,-140,70,6);
 c.shadowBlur=22*R*UI;c.fillStyle=sk;rr(c,-14,-138,58,70,20);c.fill();c.shadowBlur=10*R*UI;
 rr(c,12,-80,16,30,8);c.fill();rr(c,25,-82,15,28,7.5);c.fill();rr(c,36,-86,13,25,6.5);c.fill();ell(c,-16,-100,9,24,-.6);c.fill();rr(c,-10,-86,20,88,10);c.fill();c.shadowBlur=0;
 c.strokeStyle='rgba(170,120,60,.45)';c.lineWidth=1.5;rr(c,-10,-86,20,88,10);c.stroke();c.beginPath();c.moveTo(-5,-30);c.lineTo(5,-30);c.moveTo(-5,-52);c.lineTo(5,-52);c.stroke();
 c.fillStyle='rgba(255,255,255,.7)';ell(c,-2,-8,5,3);c.fill();c.restore()}
function bubble(c,x,y,txt,a){c.save();c.globalAlpha=a;const s=UI;c.font=`italic 600 ${Math.round(30*s)}px Fraunces, Georgia, serif`;const w=c.measureText(txt).width+44*s,h=54*s,bx=Math.min(W-w-10,Math.max(10,x-w/2)),by=Math.min(H-h-10,Math.max(10,y-h/2));
 c.shadowColor='rgba(0,0,0,.25)';c.shadowBlur=14*R;c.fillStyle='rgba(255,251,242,.96)';rr(c,bx,by,w,h,h/2);c.fill();c.shadowBlur=0;c.strokeStyle='rgba(200,150,60,.75)';c.lineWidth=2;c.stroke();
 c.fillStyle='#4a3218';c.textBaseline='middle';c.fillText(txt,bx+22*s,by+h/2+1);c.restore()}
function brush(c,x,y){c.save();c.translate(x,y);c.scale(UI,UI);c.rotate(.55);c.fillStyle='#e7b85a';ell(c,0,-11,5,12);c.fill();c.fillStyle='#c9ccd3';c.fillRect(-5,-34,10,14);c.fillStyle='#7a4a2a';rr(c,-4,-96,8,64,4);c.fill();c.restore()}

/* ---------- main loop ---------- */
let last=performance.now()/1000;
function frame(ms){const now=ms/1000,dt=Math.min(.05,Math.max(0,now-last));last=now;
 const tgt=(phase==='done'&&perfect)?(RM?.5:1):.2;alive+=(tgt-alive)*Math.min(1,dt*1.2);st+=dt*alive;
 ctx.setTransform(1,0,0,1,0,0);ctx.drawImage(pc,0,0);ctx.setTransform(R,0,0,R,0,0);
 for(const s of splashes)drawSplash(ctx,s,now);
 if(scene&&(reveals.length||phase==='done')){
  sx.setTransform(R,0,0,R,0,0);sx.save();scene.draw(sx,st);sx.restore();
  if(perfect)full=Math.min(1,(now-doneAt)/1.4);
  if(full<1){mx.setTransform(1,0,0,1,0,0);mx.clearRect(0,0,mc.width,mc.height);mx.setTransform(R,0,0,R,0,0);mx.fillStyle='#fff';
   for(const rv of reveals){const age=now-rv.t0;for(const b of rv.c.bl){const e=ease((age-b.d)/.6);if(e>0){circ(mx,b.x,b.y,b.r*e);mx.fill()}}}
   if(full>0){circ(mx,600,400,ease(full)*760);mx.fill()}
   sx.save();sx.setTransform(1,0,0,1,0,0);sx.globalCompositeOperation='destination-in';sx.drawImage(mc,0,0);sx.restore()}
  ctx.setTransform(1,0,0,1,0,0);ctx.drawImage(sc,0,0);ctx.setTransform(R,0,0,R,0,0)}
 if(sweep>0&&now>sweep&&now<sweep+1.6){const q=(now-sweep)/1.6,x=-300+q*1900;ctx.save();ctx.globalCompositeOperation='lighter';ctx.transform(1,0,-.35,1,0,0);const g=ctx.createLinearGradient(x-220,0,x+220,0);g.addColorStop(0,'rgba(255,240,200,0)');g.addColorStop(.5,'rgba(255,240,200,.4)');g.addColorStop(1,'rgba(255,240,200,0)');ctx.fillStyle=g;ctx.fillRect(x-220,0,440,H);ctx.restore()}
 ctx.save();ctx.globalCompositeOperation='lighter';parts=parts.filter(p=>(p.life+=dt)<p.max);for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=120*dt;p.vx*=.98;const k=1-p.life/p.max;ctx.fillStyle=`rgba(${p.c},${k})`;circ(ctx,p.x,p.y,p.r*(.5+k));ctx.fill()}ctx.restore();
 hand.a+=((phase==='play'?1:0)-hand.a)*Math.min(1,dt*5);
 if(phase==='play'){const c=cells[order[step]];hand.x+=(c.tx-hand.x)*Math.min(1,dt*4);hand.y+=(c.ty-hand.y)*Math.min(1,dt*4);
  const pulse=.5+.5*Math.sin(now*4);ctx.strokeStyle=`rgba(214,160,60,${.55+.3*pulse})`;ctx.lineWidth=3;ctx.setLineDash([10,8]);ctx.lineDashOffset=-now*20;circ(ctx,c.tx,c.ty,(44+pulse*6)*Math.min(UI,1.6));ctx.stroke();ctx.setLineDash([]);
  const q=wrap(now,1.4)/1.4;ctx.strokeStyle=`rgba(214,160,60,${.6*(1-q)})`;ctx.lineWidth=2;circ(ctx,c.tx,c.ty,(30+q*80)*Math.min(UI,1.6));ctx.stroke()}
 if(hand.a>.01){const up=hand.y<250,rot=up?Math.PI-.35:.35,dx=Math.sin(rot),dy=-Math.cos(rot),off=(30+Math.sin(now*3)*7)*Math.min(UI,1.6),fx=hand.x+dx*off,fy=hand.y+dy*off;
  drawHand(ctx,fx,fy,rot,hand.a);
  const txt=now<msgUntil?msg:SAY[Math.min(step,11)],bd=215*UI;bubble(ctx,fx+dx*bd+(up?0:30),fy+dy*bd,txt,hand.a)}
 if(ptr&&phase==='play')brush(ctx,ptr.x,ptr.y);
 requestAnimationFrame(frame)}
updDots();updGal();resize();
if(document.fonts&&document.fonts.load)document.fonts.load('italic 600 30px Fraunces').catch(()=>{});
requestAnimationFrame(frame);
emit('ready');
}
