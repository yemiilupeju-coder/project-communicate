/* LOOK: bright flat cartoon. Chunky rounded shapes, two-tone shading, no outlines,
   big friendly eyes, buttons with a solid ledge that squash when pressed,
   springy (overshooting) motion everywhere. */
:root{
  --ink:#3B3F5C;--muted:#7A80A0;--line:#E2E6F0;--ledge:#CDD4E4;--bg:#EEF5FF;
  --sky:#3FB4F0;--sky-d:#1F8ED0;--grass:#4CC94A;--grass-d:#329A31;
  --sun:#FFCB2E;--sun-d:#E0A400;--coral:#FF7A5C;--coral-d:#DB5438;--grape:#9B6BFF;
  --spring:cubic-bezier(.34,1.56,.64,1);
}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:800 16px/1.5 Nunito,ui-rounded,'Segoe UI',system-ui,sans-serif;overflow-x:clip}
#app{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
header{display:flex;align-items:center;gap:12px 18px;padding:12px max(3vw,16px);flex-wrap:wrap}
h1{font:900 clamp(20px,2.3vw,26px)/1.1 Nunito,ui-rounded,system-ui,sans-serif;margin:0;color:var(--ink)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* progress: a chunky track with 12 pills that pop when filled */
#dots{display:flex;gap:6px;flex:1 1 260px;max-width:560px;margin:0 auto;padding:6px;background:#fff;border-radius:999px;box-shadow:0 0 0 2px var(--line),0 4px 0 2px var(--line)}
.dot{flex:1;height:16px;border-radius:999px;background:#E9EDF5;position:relative;transition:background .2s,transform .35s var(--spring)}
.dot.ok{background:var(--grass);animation:pop .45s var(--spring)}
.dot.ok::after,.dot.miss::after{content:'';position:absolute;left:22%;right:22%;top:3px;height:4px;border-radius:4px;background:rgba(255,255,255,.45)}
.dot.miss{background:var(--coral);animation:pop .45s var(--spring)}
.dot.now{background:#D3DDF0;animation:nudge 1.1s ease-in-out infinite}
@keyframes pop{0%{transform:scale(.6)}100%{transform:scale(1)}}
@keyframes nudge{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.35)}}

.right{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted)}
button{font:800 16px/1 Nunito,ui-rounded,system-ui,sans-serif;min-height:48px;padding:0 22px;border-radius:16px;border:2px solid var(--line);
  background:#fff;color:var(--ink);cursor:pointer;box-shadow:0 5px 0 var(--ledge);transition:transform .18s var(--spring),box-shadow .12s,filter .15s;
  -webkit-tap-highlight-color:transparent}
button:hover{transform:translateY(-2px);box-shadow:0 7px 0 var(--ledge)}
button:active{transform:translateY(5px);box-shadow:0 0 0 var(--ledge);transition-duration:.06s}
button:focus-visible,#cv:focus-visible{outline:4px solid var(--sky);outline-offset:4px}
button.primary{background:var(--grass);border-color:var(--grass);color:#fff;box-shadow:0 5px 0 var(--grass-d)}
button.primary:hover{filter:brightness(1.06);box-shadow:0 7px 0 var(--grass-d)}
button.primary:active{box-shadow:0 0 0 var(--grass-d)}
button.ghost{background:transparent;border-color:transparent;box-shadow:none;color:var(--muted)}
button.ghost:hover{color:var(--ink);box-shadow:none}
#mute,#fs{min-height:42px;padding:0 16px;font-size:15px}
#mute[aria-pressed="true"]{color:var(--muted)}

main{flex:1;display:flex;align-items:center;justify-content:center;padding:8px max(3vw,24px) 28px}
#frame{position:relative;width:min(100%,calc((100vh - var(--hh,64px) - 80px)*1.5),1560px);width:min(100%,calc((100dvh - var(--hh,64px) - 80px)*1.5),1560px);
  aspect-ratio:3/2;border-radius:30px;background:#fff;padding:10px;box-shadow:0 0 0 3px var(--line),0 10px 0 3px var(--ledge)}
#cv{display:block;width:100%;height:100%;border-radius:22px;touch-action:none;background:#FAFCFF}
@media (pointer:fine){#cv.play{cursor:none}}

/* intro: a big friendly card over the blank canvas */
.ov{position:absolute;inset:10px;display:grid;place-items:center;text-align:center;padding:4%;overflow:auto;border-radius:22px}
.ov .in{max-width:600px;background:#fff;border-radius:28px;padding:clamp(18px,3vw,34px);box-shadow:0 0 0 3px var(--line),0 8px 0 3px var(--ledge);animation:spring-in .7s var(--spring) both}
.ov h2{font:900 clamp(26px,4vw,46px)/1.05 Nunito,ui-rounded,system-ui,sans-serif;margin:.2em 0 .35em;text-wrap:balance}
.ov p{margin:0 auto 1.1em;font-weight:700;font-size:clamp(15px,1.6vw,19px);max-width:46ch;color:#555A78}
.ov .small{font-weight:700;font-size:clamp(13px,1.2vw,15px);color:var(--muted);margin:1.2em auto 0}
#begin{min-height:56px;font-size:19px;padding:0 34px;border-radius:18px}
.buddy{width:clamp(84px,11vw,124px);height:auto;display:block;margin:0 auto;transform-origin:50% 100%;animation:hop 1.6s ease-in-out infinite}
@keyframes hop{0%,100%{transform:translateY(0) scale(1,1)}12%{transform:translateY(0) scale(1.08,.9)}40%{transform:translateY(-14px) scale(.95,1.06)}62%{transform:translateY(0) scale(1.06,.93)}76%{transform:translateY(0) scale(1,1)}}
@keyframes spring-in{from{opacity:0;transform:translateY(30px) scale(.85)}}

/* end-of-round card: slides up with a bounce */
.card{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);width:min(600px,92%);background:#fff;border-radius:26px;padding:20px 24px 20px;
  text-align:center;box-shadow:0 0 0 3px var(--line),0 8px 0 3px var(--ledge);animation:rise .7s var(--spring) both}
@keyframes rise{from{opacity:0;transform:translate(-50%,60px) scale(.9)}}
.badge{width:64px;height:64px;margin:-52px auto 6px;border-radius:50%;display:grid;place-items:center;background:var(--sun);box-shadow:0 0 0 6px #fff,0 6px 0 6px var(--ledge);animation:wiggle 2.4s ease-in-out infinite .8s}
.badge svg{width:38px;height:38px}
.card[data-p="0"] .badge{background:var(--sky)}
@keyframes wiggle{0%,70%,100%{transform:rotate(0)}76%{transform:rotate(-12deg) scale(1.08)}84%{transform:rotate(10deg) scale(1.08)}92%{transform:rotate(-4deg)}}
.card .k{margin:0;color:var(--grass-d);font-weight:900;font-size:15px}
.card[data-p="0"] .k{color:var(--sky-d)}
.card h2{font:900 clamp(22px,2.6vw,30px)/1.15 Nunito,ui-rounded,system-ui,sans-serif;margin:2px 0 8px;text-wrap:balance}
.card .v{font-weight:700;font-size:17px;line-height:1.5;margin:0 auto 4px;max-width:46ch;color:#4A4F6E}
.card .ref{margin:0 0 16px;color:var(--muted);font-size:14px}
.btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
#showCard{position:absolute;right:22px;bottom:22px}

@media (max-width:1050px){#gal{display:none}}
@media (max-width:760px){
  #frame{border-radius:22px;padding:6px}
  #cv{border-radius:16px}
  main{padding:4px 12px 20px}
  .card{position:fixed;bottom:12px;width:calc(100% - 24px);padding:16px 16px}
  .card .v{font-size:15px}
  .ov .small{display:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Here a Little, There a Little</h1>
    <div id="dots" aria-label="Progress"></div>
    <div class="right"><span id="gal"></span><button id="mute" aria-pressed="false">Sound on</button><button id="fs" hidden>Full screen</button></div>
  </header>
  <main>
    <div id="frame">
      <canvas id="cv" tabindex="0" aria-label="Here a Little, There a Little painting game. Tap where the glowing hand points, or press Space to paint there."></canvas>
      <div id="intro" class="ov"><div class="in">
        <svg class="buddy" viewBox="0 0 120 130" aria-hidden="true">
          <ellipse cx="60" cy="124" rx="34" ry="6" fill="#D9E2F2"/>
          <path d="M60 6C60 6 18 52 18 82a42 42 0 0 0 84 0C102 52 60 6 60 6Z" fill="#3FB4F0"/>
          <path d="M60 6c0 0 42 46 42 76a42 42 0 0 1-42 42c22-8 32-24 32-42C92 56 60 6 60 6Z" fill="#1F8ED0"/>
          <ellipse cx="40" cy="58" rx="7" ry="13" fill="#9BDDFF" transform="rotate(25 40 58)"/>
          <circle cx="45" cy="84" r="12" fill="#fff"/><circle cx="77" cy="84" r="12" fill="#fff"/>
          <circle cx="48" cy="86" r="6.5" fill="#2B2F4A"/><circle cx="80" cy="86" r="6.5" fill="#2B2F4A"/>
          <circle cx="50" cy="83" r="2.4" fill="#fff"/><circle cx="82" cy="83" r="2.4" fill="#fff"/>
          <ellipse cx="34" cy="100" rx="7" ry="4.5" fill="#FF8FB1" opacity=".75"/><ellipse cx="88" cy="100" rx="7" ry="4.5" fill="#FF8FB1" opacity=".75"/>
          <path d="M53 101q8 8 16 0" stroke="#2B2F4A" stroke-width="5" stroke-linecap="round" fill="none"/>
          <rect x="96" y="58" width="9" height="44" rx="4.5" fill="#B5733A" transform="rotate(28 100 80)"/>
          <rect x="99" y="44" width="13" height="16" rx="4" fill="#C9D1E3" transform="rotate(28 100 80)"/>
          <path d="M105 36q8 2 7 14l-13-2q0-11 6-12Z" fill="#FFCB2E" transform="rotate(28 100 80)"/>
        </svg>
        <h2>Here a Little, There a Little</h2>
        <p>God already sees the finished picture. Watch for His hand and paint where it points. Every yes reveals a little more.</p>
        <button id="begin" class="primary">Begin painting</button>
        <p class="small">“Line upon line, line upon line; here a little, and there a little.” Isaiah 28:10 (KJV)</p>
      </div></div>
      <div id="card" class="card" hidden>
        <div class="badge" aria-hidden="true">
          <svg id="badgeStar" viewBox="0 0 40 40"><path d="M20 4l4.6 9.6 10.4 1.4-7.6 7.2 1.9 10.4L20 27.6 10.7 32.6l1.9-10.4L5 15l10.4-1.4Z" fill="#fff" stroke="#fff" stroke-width="3" stroke-linejoin="round"/></svg>
          <svg id="badgeHeart" viewBox="0 0 40 40" hidden><path d="M20 34S5 25 5 14.5A8.5 8.5 0 0 1 20 9a8.5 8.5 0 0 1 15 5.5C35 25 20 34 20 34Z" fill="#fff"/></svg>
        </div>
        <p class="k" id="cKick"></p>
        <h2 id="cTitle"></h2>
        <p class="v" id="cVerse"></p>
        <p class="ref" id="cRef"></p>
        <div class="btns"><button id="bA" class="primary"></button><button id="bB"></button><button id="bHide" class="ghost"></button></div>
      </div>
      <button id="showCard" hidden>Show verse</button>
      <p id="live" class="sr" aria-live="polite"></p>
    </div>
  </main>
</div>
<script>
{
const W=1200,H=800,TAU=Math.PI*2,INK='#2B2F4A';
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d'),card=$('card');
const mk=()=>{const c=document.createElement('canvas');return[c,c.getContext('2d')]};
const [sc,sx]=mk(),[mc,mx]=mk(),[pc,px]=mk();
let R=1,UI=1,RT=0;
const META=[{"name": "The Lion of Judah", "ref": "Revelation 5:5", "verse": "Behold, the Lion of the tribe of Juda, the Root of David, hath prevailed…"}, {"name": "Morning on the Mountains", "ref": "Lamentations 3:22–23", "verse": "…his compassions fail not. They are new every morning: great is thy faithfulness."}, {"name": "The Light on the Shore", "ref": "Psalm 119:105", "verse": "Thy word is a lamp unto my feet, and a light unto my path."}, {"name": "On Wings as Eagles", "ref": "Isaiah 40:31", "verse": "They that wait upon the LORD shall renew their strength; they shall mount up with wings as eagles."}, {"name": "The Tree of Life", "ref": "Psalm 1:3", "verse": "And he shall be like a tree planted by the rivers of water, that bringeth forth his fruit in his season."}, {"name": "Count the Stars", "ref": "Genesis 15:5", "verse": "Look now toward heaven, and tell the stars, if thou be able to number them… So shall thy seed be."}, {"name": "A New Creation", "ref": "2 Corinthians 5:17", "verse": "If any man be in Christ, he is a new creature: old things are passed away; behold, all things are become new."}, {"name": "Beside Still Waters", "ref": "Psalm 23:2", "verse": "He maketh me to lie down in green pastures: he leadeth me beside the still waters."}, {"name": "The Promise", "ref": "Genesis 9:13", "verse": "I do set my bow in the cloud, and it shall be for a token of a covenant between me and the earth."}, {"name": "Turned Toward the Light", "ref": "Isaiah 60:1", "verse": "Arise, shine; for thy light is come, and the glory of the LORD is risen upon thee."}, {"name": "A City on a Hill", "ref": "Matthew 5:14", "verse": "Ye are the light of the world. A city that is set on an hill cannot be hid."}, {"name": "The Heavens Declare", "ref": "Psalm 19:1", "verse": "The heavens declare the glory of God; and the firmament sheweth his handywork."}];
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- maths ---------- */
const srand=s=>()=>(s=(s*16807)%2147483647,(s-1)/2147483646);
const cl=x=>Math.min(1,Math.max(0,x));
const ease=x=>1-Math.pow(1-cl(x),3);
// overshoots a little, then settles: the "boing" used for every pop-in
const back=x=>{x=cl(x);const k=1.9;return 1+(k+1)*Math.pow(x-1,3)+k*Math.pow(x-1,2)};
const wrap=(v,m)=>((v%m)+m)%m;
const blink=ph=>wrap(RT+ph,3.8)<.13?.1:1;   // blinks run on real time, so characters stay lively
const bob=(t,sp=2,ph=0)=>Math.sin(t*sp+ph);

/* ---------- shape helpers (flat fills, no outlines) ---------- */
const circ=(c,x,y,r)=>{c.beginPath();c.arc(x,y,Math.max(0,r),0,TAU)};
const ell=(c,x,y,a,b,rot=0)=>{c.beginPath();c.ellipse(x,y,Math.max(0,a),Math.max(0,b),rot,0,TAU)};
function rrp(c,x,y,w,h,r){r=Math.max(0,Math.min(r,w/2,h/2));c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function rr(c,x,y,w,h,r){c.beginPath();rrp(c,x,y,w,h,r)}
const fl=(c,col)=>{c.fillStyle=col;c.fill()};
const dot=(c,x,y,r,col)=>{circ(c,x,y,r);fl(c,col)};
const oval=(c,x,y,a,b,col,rot=0)=>{ell(c,x,y,a,b,rot);fl(c,col)};
const box=(c,x,y,w,h,r,col)=>{rr(c,x,y,w,h,r);fl(c,col)};
function poly(c,pts,col,round=0){c.beginPath();pts.forEach(([x,y],i)=>i?c.lineTo(x,y):c.moveTo(x,y));c.closePath();c.fillStyle=col;c.fill();
  if(round){c.strokeStyle=col;c.lineWidth=round;c.lineJoin='round';c.stroke()}}
function line(c,pts,col,w){c.beginPath();pts.forEach(([x,y],i)=>i?c.lineTo(x,y):c.moveTo(x,y));c.strokeStyle=col;c.lineWidth=w;c.lineCap='round';c.lineJoin='round';c.stroke()}
function curve(c,x0,y0,cx,cy,x1,y1,col,w){c.beginPath();c.moveTo(x0,y0);c.quadraticCurveTo(cx,cy,x1,y1);c.strokeStyle=col;c.lineWidth=w;c.lineCap='round';c.stroke()}
// two-tone shading: a darker crescent lower-right, an optional glint upper-left
function ball(c,x,y,r,base,shade,hi){c.save();circ(c,x,y,r);fl(c,shade);c.clip();dot(c,x-r*.13,y-r*.15,r*.97,base);c.restore();
  if(hi)oval(c,x-r*.4,y-r*.45,r*.2,r*.12,hi,-.7)}
function egg(c,x,y,a,b,base,shade,hi,rot=0){c.save();c.translate(x,y);c.rotate(rot);ell(c,0,0,a,b);fl(c,shade);c.clip();oval(c,-a*.13,-b*.12,a*.97,b*.97,base);c.restore();
  if(hi){c.save();c.translate(x,y);c.rotate(rot);oval(c,-a*.42,-b*.45,a*.2,b*.11,hi,-.6);c.restore()}}

/* ---------- faces ---------- */
function eye(c,x,y,r,lx=0,ly=0,ph=0){c.save();c.translate(x,y);c.scale(1,blink(ph));dot(c,0,0,r,'#fff');
  dot(c,lx*r*.32,ly*r*.32+r*.06,r*.6,INK);dot(c,lx*r*.32+r*.22,ly*r*.32-r*.16,r*.22,'#fff');c.restore()}
function eyes(c,x,y,gap,r,lx=0,ly=0,ph=0){eye(c,x-gap,y,r,lx,ly,ph);eye(c,x+gap,y,r,lx,ly,ph)}
function happyEyes(c,x,y,gap,r){for(const s of[-1,1]){c.beginPath();c.arc(x+s*gap,y+r*.4,r*.75,Math.PI*1.15,Math.PI*1.85);c.strokeStyle=INK;c.lineWidth=r*.42;c.lineCap='round';c.stroke()}}
function cheeks(c,x,y,gap,r){c.save();c.globalAlpha=.55;for(const s of[-1,1])oval(c,x+s*gap,y,r,r*.62,'#FF7FA8');c.restore()}
function smile(c,x,y,w,lw){c.beginPath();c.arc(x,y-w*.5,w*.7,Math.PI*.22,Math.PI*.78);c.strokeStyle=INK;c.lineWidth=lw||w*.3;c.lineCap='round';c.stroke()}

/* ---------- scenery ---------- */
function rings(c,x,y,list){for(const [r,col] of list)dot(c,x,y,r,col)}
function rays(c,x,y,n,len,wid,rot,col){c.save();c.translate(x,y);c.rotate(rot);c.fillStyle=col;for(let i=0;i<n;i++){c.rotate(TAU/n);c.beginPath();c.moveTo(0,0);c.lineTo(-wid,-len);c.lineTo(wid,-len);c.closePath();c.fill()}c.restore()}
function hill(c,y0,amp,len,ph,col,bottom=H){c.beginPath();c.moveTo(-10,bottom);for(let x=-10;x<=W+12;x+=12)c.lineTo(x,y0-amp*Math.sin(x/len+ph));c.lineTo(W+12,bottom);c.closePath();fl(c,col)}
const PUFF=[[0,0,38],[44,-24,50],[96,-6,40],[132,10,28],[-38,10,28]];
function cloud(c,x,y,s,col='#fff',shade='#D6E8FA'){for(const [k,cc] of [[10,shade],[0,col]]){c.beginPath();
  for(const [dx,dy,r] of PUFF){c.moveTo(x+dx*s+r*s,y+(dy+k)*s);c.arc(x+dx*s,y+(dy+k)*s,r*s,0,TAU)}rrp(c,x-62*s,y+(k-4)*s,216*s,42*s,21*s);fl(c,cc)}}
function sun(c,x,y,r,face=true){ball(c,x,y,r,'#FFE066','#FFC93C','#FFF6C2');
  if(face){happyEyes(c,x,y-r*.06,r*.32,r*.17);cheeks(c,x,y+r*.24,r*.52,r*.15);smile(c,x,y+r*.34,r*.34)}}
function starPath(c,x,y,r,rot=0,inner=.5){c.beginPath();for(let i=0;i<10;i++){const a=rot-Math.PI/2+i*Math.PI/5,q=i%2?r*inner:r;c.lineTo(x+Math.cos(a)*q,y+Math.sin(a)*q)}c.closePath()}
function star(c,x,y,r,col,rot=0){if(r<=0)return;starPath(c,x,y,r,rot);c.fillStyle=col;c.fill();c.strokeStyle=col;c.lineWidth=r*.32;c.lineJoin='round';c.stroke()}
function sparkle(c,x,y,r,col){if(r<=0)return;c.beginPath();c.moveTo(x,y-r);c.quadraticCurveTo(x+r*.14,y-r*.14,x+r,y);c.quadraticCurveTo(x+r*.14,y+r*.14,x,y+r);
  c.quadraticCurveTo(x-r*.14,y+r*.14,x-r,y);c.quadraticCurveTo(x-r*.14,y-r*.14,x,y-r);fl(c,col)}
function mountain(c,cx,base,hw,h,col,shade,snow=true){const top=base-h;
  poly(c,[[cx,top],[cx+hw,base],[cx-hw,base]],col,44);poly(c,[[cx,top],[cx+hw,base],[cx+hw*.12,base]],shade,44);
  if(snow)poly(c,[[cx,top],[cx+hw*.3,top+h*.3],[cx+hw*.14,top+h*.25],[cx,top+h*.33],[cx-hw*.15,top+h*.25],[cx-hw*.3,top+h*.3]],'#FFFFFF',30)}
function tree(c,x,y,h,r,g,gd,trunk='#A8673C'){box(c,x-r*.17,y-h,r*.34,h,r*.17,trunk);ball(c,x,y-h-r*.45,r,g,gd)}
function pine(c,x,y,h,col,shade){const w=h*.36;box(c,x-h*.05,y-h*.18,h*.1,h*.2,h*.05,'#6B4A3A');
  for(let i=0;i<3;i++){const top=y-h+i*h*.25,bot=top+h*.42,ww=w*(.55+i*.25);poly(c,[[x,top],[x+ww,bot],[x-ww,bot]],col,h*.09);poly(c,[[x,top],[x+ww,bot],[x+ww*.1,bot]],shade,h*.09)}}
function birdV(c,x,y,s,t,ph,col){const f=Math.sin(t*7+ph);line(c,[[x-18*s,y-8*s-f*9*s],[x-6*s,y-2*s],[x,y+2*s],[x+6*s,y-2*s],[x+18*s,y-8*s-f*9*s]],col,5*s)}
function flower(c,x,y,s,col,t,ph){const sw=Math.sin(t*1.4+ph)*5*s;curve(c,x,y,x,y-14*s,x+sw,y-28*s,'#3FA535',4*s);
  for(let i=0;i<5;i++){const a=i/5*TAU+ph;dot(c,x+sw+Math.cos(a)*8*s,y-28*s+Math.sin(a)*8*s,7*s,col)}dot(c,x+sw,y-28*s,6*s,col==='#FFCB2E'?'#FF8A3D':'#FFCB2E')}

/* ---------- characters ---------- */
function lion(c,x,y,t){const sq=bob(t,2.2)*.025;c.save();c.translate(x,y+300);c.scale(1+sq,1-sq);c.translate(0,-300);
  c.save();c.translate(110,200);c.rotate(Math.sin(t*1.8)*.2);curve(c,0,0,110,-10,118,-92,'#F2A93B',22);ball(c,120,-106,27,'#D45E1F','#B84C18');c.restore();
  egg(c,0,205,128,105,'#FFC24B','#F2A93B','#FFE19A');oval(c,0,222,70,60,'#FFE6A8');
  for(const s of[-1,1]){egg(c,s*62,294,50,28,'#FFC24B','#F2A93B');for(let i=-1;i<=1;i++)line(c,[[s*62+i*15,286],[s*62+i*15,300]],'#E0952F',5)}
  c.save();c.translate(0,60);c.rotate(Math.sin(t*.9)*.05);c.translate(0,-60);
  dot(c,0,0,176,'#B84C18');

  mountain(c,200,600,280,260,'#3A4C90','#2F4080');mountain(c,520,600,220,200,'#3A4C90','#2F4080');mountain(c,880,600,300,290,'#3A4C90','#2F4080');mountain(c,1120,600,180,180,'#3A4C90','#2F4080');
  c.fillStyle='#22356E';c.fillRect(0,600,W,200);c.save();c.beginPath();c.rect(0,600,W,200);c.clip();this.rib(c,t,true,.22);c.restore();
  for(let i=0;i<8;i++){const y=630+i*i*2.2;box(c,wrap(i*190+t*20,W+200)-100,y,80+i*10,5,2.5,'rgba(255,255,255,.18)')}
  c.fillStyle='#1B2C5C';c.fillRect(0,596,W,12);
  for(const s of this.sm){const q=wrap(s.o+t*.12,1);dot(c,690+Math.sin(t+s.p)*8+q*40,512-q*150,8+q*20,`rgba(220,228,255,${.45*(1-q)})`)}
  box(c,676,505,20,50,6,'#8E3B3B');
  box(c,560,540,140,64,12,'#C9773E');box(c,640,540,60,64,12,'#B0642F');
  poly(c,[[548,546],[630,488],[712,546]],'#8E3B3B',20);poly(c,[[630,488],[712,546],[636,546]],'#7A3030',20);
  rings(c,598,570,[[44,'rgba(255,227,138,.2)']]);box(c,584,556,30,26,8,'#FFE38A');box(c,650,562,26,42,10,'#6B3A22');
  for(const q of this.tr)pine(c,q.x,606,q.h,'#1F8A6A','#17705A');
  fox(c,420,560,t)}}
];

/* ---------- game state ---------- */
const COLS=4,ROWS=3,CW=W/COLS,CH=H/ROWS;
const SAY=['Here a little','There a little','Now here','Then here','Trust Me — here','Right here','This one too','Keep going — here','Over here','Almost there — here','Here a little more','Last one. Right here.'];
const MISS=['Lovely… but follow My hand','Beautiful — but I had a plan','Keep your eyes on My hand','That was yours. Try Mine.'];
const NOTES=[261.63,293.66,329.63,392,440,523.25,587.33,659.25,783.99,880,1046.5,1174.66];
const CONF=['#FF5A6E','#FFCB2E','#45B5FF','#5CD65C','#9B6BFF','#FF9F3C','#FF7AB6'];
const SPLAT=['#FF7AB6','#B98BFF','#45B5FF','#FF9F3C','#5CD65C'];
let cur=-1,scene=null,cells=[],order=[],step=0,res=[],reveals=[],splashes=[],parts=[],phase='intro',st=0,alive=.2,full=0,doneAt=0,lock=0,perfect=false,msg='',msgUntil=0,ptr=null,sweep=-1;
const hand={x:1350,y:950,vx:0,vy:0,a:0};
const bub={txt:'',t0:0};
let seen=[];try{seen=JSON.parse(localStorage.getItem('here-a-little-seen')||'[]')}catch(e){}

/* ---------- audio ---------- */
let AC=null,master=null,muted=false;
function audioInit(){if(AC)return;try{AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.55;const d=AC.createDelay(),fb=AC.createGain(),lp=AC.createBiquadFilter();d.delayTime.value=.22;fb.gain.value=.25;lp.frequency.value=2400;d.connect(lp);lp.connect(fb);fb.connect(d);master.connect(AC.destination);master.connect(d);d.connect(AC.destination)}catch(e){AC=null}}
function note(f,when=0,dur=1.2,vol=.15,type='sine',slide=0){if(!AC||muted)return;try{const t0=AC.currentTime+when,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t0);if(slide)o.frequency.exponentialRampToValueAtTime(f*slide,t0+.12);g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(vol,t0+.015);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);o.connect(g);g.connect(master);o.start(t0);o.stop(t0+dur+.05)}catch(e){}}
const pop=()=>note(520,0,.18,.12,'sine',1.9);

/* ---------- layout ---------- */
function paper(){px.setTransform(R,0,0,R,0,0);px.fillStyle='#FAFCFF';px.fillRect(0,0,W,H);px.fillStyle='#E3EAF6';
 for(let y=20,row=0;y<H;y+=40,row++)for(let x=20+(row%2)*20;x<W;x+=40){circ(px,x,y,2.6);px.fill()}}
function resize(){const r=cv.getBoundingClientRect();if(!r.width)return;const dpr=Math.min(window.devicePixelRatio||1,2);R=Math.max(.5,Math.min(2,r.width*dpr/W));UI=Math.min(2.4,Math.max(1,760/r.width));
 for(const c of[cv,sc,mc,pc]){c.width=Math.round(W*R);c.height=Math.round(H*R)}paper()}
const ro=new ResizeObserver(resize);ro.observe(cv);
const hdr=document.querySelector('header'),hro=new ResizeObserver(()=>document.documentElement.style.setProperty('--hh',hdr.offsetHeight+'px'));hro.observe(hdr);

/* ---------- embedding: events + announcements ---------- */
const embedded=(()=>{try{return window.self!==window.top}catch(e){return true}})();
function emit(type,data={}){if(!embedded)return;try{window.parent.postMessage({source:'here-a-little',type,...data},'*')}catch(e){}}
const ROWN=['top','middle','bottom'],COLN=['far left','left','right','far right'];
const where=i=>`${ROWN[Math.floor(i/COLS)]}, ${COLN[i%COLS]}`;
function say(t){$('live').textContent='';setTimeout(()=>{$('live').textContent=t},60)}
const nextLine=()=>`Step ${step+1} of 12. The hand points to the ${where(order[step])}. Tap there or press Space.`;

/* ---------- rounds ---------- */
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function newRound(same){
 if(!same||cur<0){let pool=SC.map((_,i)=>i).filter(i=>i!==cur&&!seen.includes(i));if(!pool.length)pool=SC.map((_,i)=>i).filter(i=>i!==cur);cur=pool[Math.floor(Math.random()*pool.length)]}
 scene=SC[cur];if(!scene.ready){scene.init();scene.ready=true}
 cells=[];for(let i=0;i<12;i++){const x=(i%COLS)*CW,y=Math.floor(i/COLS)*CH,tx=x+CW/2+(Math.random()-.5)*80,ty=y+CH/2+(Math.random()-.5)*70,bl=[];
  for(let gy=0;gy<3;gy++)for(let gx=0;gx<3;gx++){const bx=x+CW*(gx+.5)/3+(Math.random()-.5)*28,by=y+CH*(gy+.5)/3+(Math.random()-.5)*28;bl.push({x:bx,y:by,r:90+Math.random()*24,d:Math.hypot(bx-tx,by-ty)/260*.4})}
  for(let k=0;k<7;k++){const a=Math.random()*TAU,dd=120+Math.random()*90;bl.push({x:tx+Math.cos(a)*dd,y:ty+Math.sin(a)*dd*.8,r:8+Math.random()*22,d:.3+Math.random()*.3})}
  cells.push({tx,ty,bl,x,y})}
 order=shuffle([...Array(12).keys()]);step=0;res=[];reveals=[];splashes=[];parts=[];full=0;perfect=false;phase='play';alive=.2;st=Math.random()*40;msg='';msgUntil=0;sweep=-1;lock=0;
 card.hidden=true;$('showCard').hidden=true;cv.classList.add('play');updDots();cv.focus({preventScroll:true});
 say('New canvas. Follow the hand. '+nextLine());emit('round-start',{scene:scene.name})}
function burst(x,y,n,cols,power=1){for(let i=0;i<n;i++){const a=Math.random()*TAU,v=(140+Math.random()*320)*power;
 parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-220*power,life:0,max:1+Math.random()*.8,c:cols[i%cols.length],r:5+Math.random()*7,rot:Math.random()*TAU,vr:(Math.random()-.5)*12,k:i%3})}}
function paint(x,y){const now=performance.now()/1000;if(phase!=='play'||now<lock)return;const c=cells[order[step]];
 const inCell=x>=c.x&&x<c.x+CW&&y>=c.y&&y<c.y+CH;
 if(inCell||Math.hypot(x-c.tx,y-c.ty)<115*Math.min(UI,1.6)){reveals.push({c,t0:now});res.push('ok');burst(c.tx,c.ty,26,CONF);pop();note(NOTES[step],.03,1.4,.15,'triangle');note(NOTES[step]*2,.05,.9,.04)}
 else{const dr=Array.from({length:6},()=>{const a=Math.random()*TAU,d=58+Math.random()*34;return[Math.cos(a)*d,Math.sin(a)*d,5+Math.random()*7]});
  splashes.push({x,y,t0:now,col:SPLAT[Math.floor(Math.random()*SPLAT.length)],n:5+Math.floor(Math.random()*3),rot:Math.random()*TAU,dr});res.push('miss');msg=MISS[Math.floor(Math.random()*MISS.length)];msgUntil=now+2;note([196,220,233.08][Math.floor(Math.random()*3)],0,.8,.1,'triangle',.8)}
 const ok=res[res.length-1]==='ok';emit('stroke',{step:step+1,followed:ok});
 step++;lock=now+.4;updDots();if(step>=12)finish(now);else say((ok?'Painted. ':'That stroke was yours, not His. ')+nextLine())}
function finish(now){const miss=res.filter(r=>r==='miss').length;perfect=miss===0;doneAt=now;phase='done';cv.classList.remove('play');updDots();
 emit('round-complete',{scene:scene.name,perfect,followed:12-miss});
 if(perfect){sweep=now+.5;if(!seen.includes(cur)){seen.push(cur);try{localStorage.setItem('here-a-little-seen',JSON.stringify(seen))}catch(e){}}updGal();
  [0,4,7,12,16,19,24].forEach((s,i)=>note(261.63*Math.pow(2,s/12),.45+i*.11,1.6,.11,'triangle'));[0,4,7].forEach(s=>note(130.81*Math.pow(2,s/12),1.3,3,.07));
  for(let i=0;i<6;i++)setTimeout(()=>burst(150+Math.random()*900,160+Math.random()*420,34,CONF,1.2),600+i*230);
  setTimeout(()=>showCard(true,0),2700)}
 else{note(392,.3,1.2,.08,'triangle');note(329.63,.7,1.6,.08,'triangle');setTimeout(()=>showCard(false,miss),1100)}}

/* ---------- UI ---------- */
function updDots(){const box0=$('dots');if(box0.children.length!==12){box0.innerHTML='';for(let i=0;i<12;i++){const d=document.createElement('i');d.className='dot';box0.appendChild(d)}}
 [...box0.children].forEach((d,i)=>{d.className=`dot ${res[i]||''} ${phase==='play'&&i===step?'now':''}`})}
function updGal(){$('gal').textContent=`${seen.length} of 12 revealed`}
function showCard(p,miss){const s=scene;$('cKick').textContent=p?'You said yes twelve times.':`${12-miss} of 12 strokes followed His hand.`;$('cTitle').textContent=p?s.name:'Beautiful… but not yet complete';
 $('cVerse').textContent=p?`“${s.verse}”`:'Your own strokes made something lovely. But He had a masterpiece in mind, and it is still waiting for your yes.';
 $('cRef').textContent=p?`${s.ref} (KJV)`:'“He which hath begun a good work in you will perform it.” Philippians 1:6 (KJV)';
 $('bA').textContent=p?'Paint another':'Try again — say yes';$('bB').textContent=p?'Paint this one again':'New canvas';$('bHide').textContent=p?'Just watch':'Hide';
 $('badgeStar').hidden=!p;$('badgeHeart').hidden=p;
 card.dataset.p=p?'1':'0';card.hidden=false;say(`${$('cKick').textContent} ${$('cTitle').textContent}. ${$('cVerse').textContent} ${$('cRef').textContent}`);$('showCard').hidden=true;$('bA').focus({preventScroll:true})}
$('bA').onclick=()=>newRound(card.dataset.p!=='1');
$('bB').onclick=()=>newRound(card.dataset.p==='1');
$('bHide').onclick=()=>{card.hidden=true;$('showCard').hidden=false};
$('showCard').onclick=()=>{card.hidden=false;$('showCard').hidden=true};
$('begin').onclick=()=>{audioInit();pop();$('intro').hidden=true;newRound(false)};
{const fs=$('fs'),de=document.documentElement;if(document.fullscreenEnabled||document.webkitFullscreenEnabled){fs.hidden=false;
 fs.onclick=()=>{try{const on=document.fullscreenElement||document.webkitFullscreenElement;if(on)(document.exitFullscreen||document.webkitExitFullscreen).call(document);else{const r=(de.requestFullscreen||de.webkitRequestFullscreen).call(de);if(r&&r.catch)r.catch(()=>{})}}catch(e){}};
 const upd=()=>{fs.textContent=(document.fullscreenElement||document.webkitFullscreenElement)?'Exit full screen':'Full screen'};document.addEventListener('fullscreenchange',upd);document.addEventListener('webkitfullscreenchange',upd)}}
$('mute').onclick=e=>{muted=!muted;e.currentTarget.textContent=muted?'Sound off':'Sound on';e.currentTarget.setAttribute('aria-pressed',muted)};
const toL=e=>{const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H}};
cv.addEventListener('pointerdown',e=>{if(AC&&AC.state==='suspended')AC.resume();const p=toL(e);if(e.pointerType==='mouse')ptr=p;if(phase==='play')paint(p.x,p.y);else if(phase==='done'&&card.hidden){card.hidden=false;$('showCard').hidden=true}});
cv.addEventListener('pointermove',e=>{if(e.pointerType==='mouse')ptr=toL(e)});
cv.addEventListener('pointerleave',()=>ptr=null);
cv.addEventListener('keydown',e=>{if((e.key===' '||e.key==='Enter')&&phase==='play'){e.preventDefault();const c=cells[order[step]];paint(c.tx,c.ty)}});

/* ---------- overlays drawn on the canvas ---------- */
function drawSplash(c,s,now){const e=back((now-s.t0)/.45);c.save();c.translate(s.x,s.y);c.rotate(s.rot);c.scale(e,e);c.fillStyle=s.col;
 c.beginPath();c.arc(0,0,40,0,TAU);for(let i=0;i<s.n;i++){const a=i/s.n*TAU;c.moveTo(Math.cos(a)*36+18,Math.sin(a)*36);c.arc(Math.cos(a)*36,Math.sin(a)*36,18,0,TAU)}
 for(const d of s.dr){c.moveTo(d[0]+d[2],d[1]);c.arc(d[0],d[1],d[2],0,TAU)}c.fill();
 oval(c,-12,-14,12,7,'rgba(255,255,255,.45)',-.6);c.restore()}
function drawHand(c,x,y,rot,a,now){c.save();c.translate(x,y);c.rotate(rot);const sq=RM?0:Math.sin(now*6.4)*.04;c.scale(UI*(1+sq),UI*(1-sq));c.globalAlpha=a;
 const G='#FFD45C',GD='#F2B632',GH='#FFF0B8';
 box(c,-32,-200,86,54,22,'#FFFFFF');box(c,-32,-164,86,14,7,'#DCE4F2');
 box(c,-24,-152,70,78,28,G);box(c,18,-148,28,70,14,GD);
 for(const [fx,fy,r] of [[16,-82,14],[31,-86,13],[42,-94,11]]){dot(c,fx,fy,r,GD);dot(c,fx-2,fy-2,r-1,G)}
 egg(c,-26,-108,13,27,G,GD,null,-.5);
 box(c,-13,-98,28,104,14,G);box(c,5,-92,10,94,5,GD);box(c,-7,-20,15,17,7,GH);
 oval(c,-14,-138,10,6,GH,-.5);c.restore()}
function bubble(c,x,y,txt,a,now){if(txt!==bub.txt){bub.txt=txt;bub.t0=now}const k=RM?1:back((now-bub.t0)/.35);
 c.save();c.globalAlpha=a;const s=UI;c.font=`900 ${Math.round(27*s)}px Nunito, ui-rounded, 'Segoe UI', system-ui, sans-serif`;
 const w=c.measureText(txt).width+50*s,h=58*s,bx=Math.min(W-w-12,Math.max(12,x-w/2)),by=Math.min(H-h-18,Math.max(12,y-h/2));
 c.translate(bx+w/2,by+h/2);c.scale(k,k);c.translate(-bx-w/2,-by-h/2);
 box(c,bx,by+6*s,w,h,22*s,'#CDD4E4');box(c,bx,by,w,h,22*s,'#FFFFFF');rr(c,bx,by,w,h,22*s);c.strokeStyle='#E2E6F0';c.lineWidth=3*s;c.stroke();
 c.fillStyle=INK;c.textBaseline='middle';c.fillText(txt,bx+25*s,by+h/2+1);c.restore()}
function brush(c,x,y){c.save();c.translate(x,y);c.scale(UI,UI);c.rotate(.55);oval(c,0,-13,9,16,'#FF7AB6');box(c,-9,-40,18,20,7,'#C9D1E3');box(c,-7,-108,14,72,7,'#FFB547');box(c,1,-104,4,64,2,'#FFD08A');c.restore()}

/* ---------- main loop ---------- */
let last=performance.now()/1000;
function frame(ms){const now=ms/1000,dt=Math.min(.05,Math.max(0,now-last));last=now;RT=now;
 const tgt=(phase==='done'&&perfect)?(RM?.4:1):(RM?.15:.45);alive+=(tgt-alive)*Math.min(1,dt*1.2);st+=dt*alive;
 ctx.setTransform(1,0,0,1,0,0);ctx.drawImage(pc,0,0);ctx.setTransform(R,0,0,R,0,0);
 for(const s of splashes)drawSplash(ctx,s,now);
 if(scene&&(reveals.length||phase==='done')){
  sx.setTransform(R,0,0,R,0,0);sx.save();scene.draw(sx,st);sx.restore();
  if(perfect)full=Math.min(1,(now-doneAt)/1.2);
  if(full<1){mx.setTransform(1,0,0,1,0,0);mx.clearRect(0,0,mc.width,mc.height);mx.setTransform(R,0,0,R,0,0);mx.fillStyle='#fff';
   for(const rv of reveals){const age=now-rv.t0;for(const b of rv.c.bl){const e=back((age-b.d)/.5);if(e>0){circ(mx,b.x,b.y,b.r*e);mx.fill()}}}
   if(full>0){circ(mx,600,400,back(full)*760);mx.fill()}
   sx.save();sx.setTransform(1,0,0,1,0,0);sx.globalCompositeOperation='destination-in';sx.drawImage(mc,0,0);sx.restore()}
  ctx.setTransform(1,0,0,1,0,0);ctx.drawImage(sc,0,0);ctx.setTransform(R,0,0,R,0,0)}
 for(const rv of reveals){const q=(now-rv.t0)/.55;if(q<1){circ(ctx,rv.c.tx,rv.c.ty,40+ease(q)*190);ctx.strokeStyle=`rgba(255,255,255,${.9*(1-q)})`;ctx.lineWidth=14*(1-q);ctx.stroke()}}
 if(sweep>0&&now>sweep&&now<sweep+1.4){const q=(now-sweep)/1.4,x=-300+ease(q)*1900;ctx.save();ctx.transform(1,0,-.35,1,0,0);ctx.fillStyle='rgba(255,255,255,.35)';ctx.fillRect(x-90,0,90,H);ctx.fillRect(x+30,0,36,H);ctx.restore()}
 parts=parts.filter(p=>(p.life+=dt)<p.max);
 for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=520*dt;p.vx*=.985;p.rot+=p.vr*dt;ctx.save();ctx.globalAlpha=Math.min(1,(1-p.life/p.max)*3);ctx.translate(p.x,p.y);ctx.rotate(p.rot);
  if(p.k===0)box(ctx,-p.r,-p.r*.5,p.r*2,p.r,p.r*.45,p.c);else if(p.k===1)dot(ctx,0,0,p.r*.8,p.c);else star(ctx,0,0,p.r,p.c);ctx.restore()}
 hand.a+=((phase==='play'?1:0)-hand.a)*Math.min(1,dt*5);
 if(phase==='play'){const c=cells[order[step]];
  // springy follow: the hand overshoots a touch and settles on the new spot
  hand.vx+=((c.tx-hand.x)*90-hand.vx*12)*dt;hand.vy+=((c.ty-hand.y)*90-hand.vy*12)*dt;hand.x+=hand.vx*dt;hand.y+=hand.vy*dt;
  const pulse=RM?0:Math.sin(now*5),r0=(48+pulse*5)*Math.min(UI,1.6);
  circ(ctx,c.tx,c.ty,r0);ctx.lineWidth=13;ctx.strokeStyle='#FFCB2E';ctx.stroke();ctx.lineWidth=4;ctx.strokeStyle='#FFFFFF';ctx.stroke();
  const q=wrap(now,1.2)/1.2;circ(ctx,c.tx,c.ty,r0+q*70);ctx.lineWidth=7*(1-q);ctx.strokeStyle=`rgba(255,203,46,${.8*(1-q)})`;ctx.stroke();
  for(let i=0;i<3;i++){const a=now*1.4+i*TAU/3;sparkle(ctx,c.tx+Math.cos(a)*(r0+24),c.ty+Math.sin(a)*(r0+24),(9+3*Math.sin(now*4+i))*Math.min(UI,1.6),'#FFCB2E')}}
 if(hand.a>.01){const up=hand.y<250,rot=up?Math.PI-.35:.35,dx=Math.sin(rot),dy=-Math.cos(rot),tap=RM?.5:Math.abs(Math.sin(now*3.2)),off=(22+tap*18)*Math.min(UI,1.6),fx=hand.x+dx*off,fy=hand.y+dy*off;
  drawHand(ctx,fx,fy,rot,hand.a,now);
  const txt=now<msgUntil?msg:SAY[Math.min(step,11)],bd=225*UI;bubble(ctx,fx+dx*bd+(up?0:30),fy+dy*bd,txt,hand.a,now)}
 if(ptr&&phase==='play')brush(ctx,ptr.x,ptr.y);
 requestAnimationFrame(frame)}
updDots();updGal();resize();
if(document.fonts&&document.fonts.load)document.fonts.load('900 27px Nunito').catch(()=>{});
requestAnimationFrame(frame);
emit('ready');
}
